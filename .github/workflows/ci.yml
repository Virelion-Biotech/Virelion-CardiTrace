name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]' build ruff
      - name: Compile and check fatal lint errors
        run: |
          python -m compileall -q src tests scripts
          python -m ruff check src tests scripts --select E9,F63,F7,F82
      - name: Test integrity, concurrency and recovery
        run: python -m pytest -q
      - name: Build distribution
        run: python -m build --wheel --sdist
      - name: Install built wheel
        run: python -c "import pathlib,subprocess,sys; wheel=next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(wheel)])"
      - name: Exercise installed package and command adapters
        run: python scripts/package_smoke.py --installed
